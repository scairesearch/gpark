[project]
name = "gpark"
version = "0.1.0.dev0"
description = "Hand-written PTX kernels for quant, ML, RL and agentic workloads"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
keywords = ["gpu", "ptx", "cuda", "quant", "triton", "cupy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

# No runtime dependencies on purpose. A tool whose whole claim is "the PTX we
# emit is the PTX we mean" cannot afford to have a dependency decide what it emits.
dependencies = []

[project.urls]
Homepage = "https://github.com/scairesearch/gpark"
Source = "https://github.com/scairesearch/gpark"
Changelog = "https://github.com/scairesearch/gpark/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpark"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Known gap: the canonical AGPL text is at the repository root, one level up, and
# hatchling cannot reach it from here.
#   * force-include "../LICENSE" works when building the wheel directly, but breaks
#     `python -m build`, which builds the wheel from the unpacked sdist where the path
#     no longer resolves.
#   * license-files = ["../LICENSE"] builds, but writes a member literally named
#     `licenses/../LICENSE` into the archive, because the `..` is not sanitised.
# Copying LICENSE in here instead would duplicate a legal document and let the two
# copies drift. So the distribution declares `license = "AGPL-3.0-or-later"` above,
# which is what PyPI displays and what tooling reads, and does not carry the text.
#
# The real fix is to move this pyproject.toml to the repository root so LICENSE is in
# the project directory. That is a packaging restructure, not a metadata edit, so it
# has not been done here.
